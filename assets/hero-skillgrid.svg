<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="SkillGrid: un comando y tu agente de IA queda con disciplina">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#b6f36b" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#7cb342" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a1206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4420"/>
      <stop offset="100%" stop-color="#16210f"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#0a1206"/>
  <rect width="1200" height="360" fill="url(#halo)"/>

  <g transform="rotate(-4 600 190)" filter="url(#sombra)">
    <rect x="150" y="52" width="900" height="256" rx="20" fill="#10180c" stroke="url(#borde)" stroke-width="1.5"/>

    <circle cx="186" cy="84" r="5" fill="#3c5029"/>
    <circle cx="204" cy="84" r="5" fill="#3c5029"/>
    <circle cx="222" cy="84" r="5" fill="#3c5029"/>
    <line x1="150" y1="106" x2="1050" y2="106" stroke="#1d2a13" stroke-width="1"/>

    <text x="186" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#b6f36b">$ npm i -g @fabianmelomaciel/skillgrid</text>
    <text x="186" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6f8357">/brainstorming   /agente-ideas   /auditor-de-seguridad</text>
    <text x="186" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6f8357">/audit-loop   /code-simplification   /ponytail</text>

    <line x1="186" y1="262" x2="1014" y2="262" stroke="#1d2a13" stroke-width="1"/>

    <circle cx="196" cy="284" r="4" fill="#b6f36b"/>
    <text x="212" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8fa377">gate en cada commit</text>
    <circle cx="470" cy="284" r="4" fill="#b6f36b"/>
    <text x="486" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8fa377">memoria entre sesiones</text>
    <circle cx="766" cy="284" r="4" fill="#b6f36b"/>
    <text x="782" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8fa377">4 IDEs</text>

    <rect x="886" y="266" width="128" height="34" rx="17" fill="#b6f36b"/>
    <text x="950" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0a1206">instalar</text>
  </g>
</svg>
