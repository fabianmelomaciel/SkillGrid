<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SkillGrid rules: los estandares de tu proyecto, para cada lenguaje">
  <defs>
    <radialGradient id="halo" cx="46%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#b6f36b" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#7cb342" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a1206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4420"/>
      <stop offset="100%" stop-color="#16210f"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0a1206"/>
  <rect width="1200" height="320" fill="url(#halo)"/>

  <g transform="rotate(-3 600 170)" filter="url(#sombra)">
    <rect x="170" y="46" width="860" height="230" rx="20" fill="#10180c" stroke="url(#borde)" stroke-width="1.5"/>

    <circle cx="206" cy="78" r="5" fill="#3c5029"/>
    <circle cx="224" cy="78" r="5" fill="#3c5029"/>
    <circle cx="242" cy="78" r="5" fill="#3c5029"/>
    <line x1="170" y1="100" x2="1030" y2="100" stroke="#1d2a13" stroke-width="1"/>

    <text x="206" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#b6f36b">$ ./install.sh typescript python</text>

    <text x="206" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6f8357">rules/common/       reglas/typescript/   reglas/python/</text>
    <text x="206" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6f8357">rules/golang/       reglas/web/           reglas/php/</text>

    <line x1="206" y1="238" x2="994" y2="238" stroke="#1d2a13" stroke-width="1"/>
    <circle cx="216" cy="256" r="4" fill="#b6f36b"/>
    <text x="232" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8fa377">lo especifico pisa a lo general</text>
  </g>
</svg>
