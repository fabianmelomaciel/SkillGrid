name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run skill structure tests
        run: node tests/skills.test.js

      - name: Run audit-loop tests
        run: node tests/audit-loop/audit-loop.test.js

      - name: Validate models.json
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('models.json','utf-8'));if(!m.models||!m.platforms)process.exit(1);console.log('models.json: ' + Object.keys(m.models).length + ' models, ' + Object.keys(m.platforms).length + ' platforms')"

      - name: Test merge-skill.js — module injection
        run: node scripts/merge-skill.js skills/humanizer/SKILL.md "deepseek-v4-flash" "" "" ${{ runner.temp }}\test-merged.md
      - name: Verify module injection
        shell: pwsh
        run: |
          if (-not (Select-String -Path "${{ runner.temp }}\test-merged.md" -Pattern "\[model:deepseek-v4-flash\]" -SimpleMatch -Quiet)) {
            Write-Error "Loader did not inject matching module"; exit 1
          }

      - name: Test merge-skill.js — stripped mode
        run: node scripts/merge-skill.js skills/humanizer/SKILL.md "" "" "" ${{ runner.temp }}\test-stripped.md "" "stripped"
      - name: Verify stripped mode
        shell: pwsh
        run: |
          if (Select-String -Path "${{ runner.temp }}\test-stripped.md" -Pattern "## Modules" -SimpleMatch -Quiet) {
            Write-Error "Stripped mode should not include ## Modules"; exit 1
          }

      - name: Test merge-skill.js — platform resolution
        run: node scripts/merge-skill.js skills/humanizer/SKILL.md "" "antigravity" models.json ${{ runner.temp }}\test-platform.md
      - name: Verify platform resolution
        shell: pwsh
        run: |
          if (-not (Select-String -Path "${{ runner.temp }}\test-platform.md" -Pattern "\[model:gemini-1.5-flash\]" -SimpleMatch -Quiet)) {
            Write-Error "Loader did not resolve antigravity -> gemini-1.5-flash"; exit 1
          }

      - name: Verify all skills are parseable by merge-skill.js
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter "SKILL.md" -Path .\skills | ForEach-Object {
            $tmp = Join-Path "${{ runner.temp }}" "verify_$($_.Name)"
            node scripts/merge-skill.js $_.FullName $tmp 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "Loader failed on: $($_.FullName)"; $errors++ }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All skills parseable by merge-skill.js"

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run skill structure tests
        run: node tests/skills.test.js

      - name: Test merge-skill.js — platform resolution (Linux)
        run: |
          node scripts/merge-skill.js skills/auditor-de-seguridad/SKILL.md "" "claude-code" models.json /tmp/test-linux.md
          if ! grep -q "\[platform:claude-code\]" /tmp/test-linux.md; then
            echo "Loader did not inject matching module"; exit 1
          fi

  skillspector-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NVIDIA SkillSpector
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git

      - name: Scan skills with SkillSpector
        run: skillspector scan ./skills/ --no-llm

