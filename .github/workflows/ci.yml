name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  check-remote-install-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Verify remote installer pin matches an existing release tag
        run: node scripts/check-remote-install-pin.js

      - name: Validate evolution list
        run: node scripts/check-evolution.js

  validate-skills:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  skillspector-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned: baselines in .skillspector/ were reviewed against this version.
      - name: Install NVIDIA SkillSpector
        run: pip install "git+https://github.com/NVIDIA/SkillSpector.git@v2.11.2"

      # One scan per skill (--baseline can't be combined with --recursive).
      # Reviewed false positives live in .skillspector/<skill>.yaml; new findings fail the job.
      - name: Scan skills with SkillSpector
        run: bash scripts/skillspector-gate.sh skills

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build cyber-neo toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./skills/cyber-neo
          push: false
          tags: skillgrid/cyber-neo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

