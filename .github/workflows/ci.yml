name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: npm audit — full report (info, never fails)
        run: npm audit --audit-level=info || true

      - name: Run unit tests
        run: npm test

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: npm audit — full report (info, never fails)
        run: npm audit --audit-level=info || true

      - name: Run unit tests
        run: npm test

  skillspector-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NVIDIA SkillSpector
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git

      - name: Scan skills with SkillSpector
        run: skillspector scan ./skills/ --no-llm

