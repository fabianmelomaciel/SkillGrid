name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.js

      - name: npm audit — dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  skillspector-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install NVIDIA SkillSpector
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git

      - name: Scan skills with SkillSpector
        run: skillspector scan ./skills/ --no-llm

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cyber-neo toolchain image
        uses: docker/build-push-action@v6
        with:
          context: ./skills/cyber-neo
          push: false
          tags: skillgrid/cyber-neo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

